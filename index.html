<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Entreprise — Expert · Économie 4e</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0f1a; --bg2:#141a2b; --bg3:#1b2238; --card:#181f33;
  --accent:#22d68a; --accent2:#19b874; --orange:#ff8a3d; --gold:#ffd166;
  --blue:#4d9bff; --purple:#a78bfa; --pink:#ff5c8a;
  --text:#eef0f6; --text2:#9aa3b8; --text3:#6b7288; --border:#2a3148;
  --radius:16px; --success:#22d68a; --error:#ff4d6d; --warning:#ffb347;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
body::before {
  content:''; position:fixed; inset:-20%; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 40% 35% at 15% 10%, rgba(34,214,138,.10), transparent 70%),
    radial-gradient(ellipse 35% 40% at 85% 90%, rgba(167,139,250,.10), transparent 70%),
    radial-gradient(ellipse 30% 30% at 70% 20%, rgba(255,209,102,.05), transparent 70%);
  animation:aurora 24s ease-in-out infinite alternate;
}
@keyframes aurora { from { transform:translate3d(0,0,0) rotate(0deg); } to { transform:translate3d(3%,2%,0) rotate(3deg); } }
button { font-family:inherit; }
:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }

/* ===== HEADER ===== */
.app-header {
  position:sticky; top:0; z-index:100; background:rgba(12,15,26,.9); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border); padding:10px 16px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark {
  width:34px; height:34px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, rgba(34,214,138,.25), rgba(255,209,102,.2)); border:1px solid rgba(255,209,102,.35); font-size:1.05rem;
}
.brand-title { font-weight:800; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-tag {
  font-size:.66rem; font-weight:800; color:var(--bg); background:linear-gradient(90deg,var(--gold),#ffb347);
  padding:2px 8px; border-radius:20px; margin-left:6px; letter-spacing:.3px; vertical-align:middle;
}
.hud { display:flex; align-items:center; gap:8px; flex-wrap:nowrap; }
.pill {
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px; font-weight:700;
  font-family:'Space Mono',monospace; font-size:.78rem; border:1px solid var(--border); background:var(--bg2); white-space:nowrap;
}
.pill.xp { color:var(--accent); border-color:rgba(34,214,138,.35); background:rgba(34,214,138,.1); position:relative; }
.pill.streak { color:var(--orange); border-color:rgba(255,138,61,.35); background:rgba(255,138,61,.1); }
.pill.streak.hot { animation:flamePulse 1s ease-in-out infinite; box-shadow:0 0 14px rgba(255,138,61,.45); }
@keyframes flamePulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.07); } }
.pill.timer { color:var(--text2); display:none; }
.icon-btn {
  width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--bg2); color:var(--text2);
  cursor:pointer; font-size:.95rem; display:flex; align-items:center; justify-content:center; transition:.2s;
}
.icon-btn:hover { border-color:var(--accent); color:var(--text); }

/* ===== XP BAR ===== */
.xp-wrap { background:rgba(12,15,26,.85); border-bottom:1px solid var(--border); padding:6px 16px 8px; position:relative; z-index:90; }
.xp-row { display:flex; justify-content:space-between; align-items:center; font-size:.76rem; color:var(--text2); max-width:760px; margin:0 auto 5px; }
.xp-rank { font-weight:800; color:var(--gold); }
.xp-track { height:7px; background:var(--bg3); border-radius:8px; overflow:hidden; max-width:760px; margin:0 auto; position:relative; border:1px solid var(--border); }
.xp-fill {
  height:100%; width:0%; border-radius:8px; transition:width .8s cubic-bezier(.22,1,.36,1);
  background:linear-gradient(90deg, var(--accent), var(--gold)); position:relative;
}
.xp-fill::after {
  content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  transform:translateX(-100%); animation:shine 2.8s ease-in-out infinite;
}
@keyframes shine { 0% { transform:translateX(-100%); } 60%,100% { transform:translateX(100%); } }
.xp-ticks { position:absolute; inset:0; pointer-events:none; }
.xp-tick { position:absolute; top:0; bottom:0; width:2px; background:rgba(12,15,26,.8); }

/* ===== NAV STRIP ===== */
.nav-strip { display:flex; justify-content:center; gap:7px; padding:10px 16px 4px; flex-wrap:wrap; position:relative; z-index:1; }
.nav-dot {
  width:30px; height:30px; border-radius:50%; border:2px solid var(--border); background:var(--bg2);
  display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; cursor:pointer;
  transition:.25s; font-family:'Space Mono',monospace; color:var(--text2);
}
.nav-dot:hover:not(.locked) { border-color:var(--accent); transform:scale(1.12); }
.nav-dot.active { border-color:var(--gold); background:var(--gold); color:var(--bg); box-shadow:0 0 12px rgba(255,209,102,.5); }
.nav-dot.completed { border-color:var(--accent); background:rgba(34,214,138,.15); color:var(--accent); }
.nav-dot.locked { opacity:.35; cursor:not-allowed; }

/* ===== LAYOUT ===== */
.main { max-width:760px; margin:0 auto; padding:16px 16px 90px; position:relative; z-index:1; }
.screen { animation:fadeIn .4s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

/* ===== BUTTONS ===== */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 26px; border-radius:12px; border:none;
  font-weight:700; font-size:.98rem; cursor:pointer; transition:.22s; text-decoration:none;
}
.btn-primary { background:var(--accent); color:var(--bg); box-shadow:0 6px 18px rgba(34,214,138,.25); }
.btn-primary:hover { background:var(--accent2); transform:translateY(-2px); box-shadow:0 10px 24px rgba(34,214,138,.35); }
.btn-gold { background:linear-gradient(90deg,var(--gold),#ffb347); color:var(--bg); box-shadow:0 6px 18px rgba(255,209,102,.25); }
.btn-gold:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(255,209,102,.4); }
.btn-outline { background:transparent; border:1.5px solid var(--accent); color:var(--accent); padding:10px 20px; font-size:.9rem; }
.btn-outline:hover { background:var(--accent); color:var(--bg); }
.btn-outline-orange { background:transparent; border:1.5px solid var(--orange); color:var(--orange); padding:10px 20px; font-size:.9rem; }
.btn-outline-orange:hover { background:var(--orange); color:var(--bg); }
.btn-ghost { background:var(--bg2); border:1px solid var(--border); color:var(--text2); padding:10px 18px; font-size:.9rem; }
.btn-ghost:hover { color:var(--text); border-color:var(--text3); }
.btn-verify { background:var(--blue); color:#fff; padding:11px 22px; font-size:.92rem; }
.btn-verify:hover { filter:brightness(1.1); }
.btn-disabled { opacity:.4; cursor:not-allowed; pointer-events:none; }
.btn-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }

/* ===== WELCOME ===== */
.hero {
  background:linear-gradient(150deg, var(--bg2), var(--bg3)); border:1px solid var(--border); border-radius:24px;
  padding:44px 28px 34px; text-align:center; position:relative; overflow:hidden;
}
.hero::before { content:''; position:absolute; top:-60%; left:50%; transform:translateX(-50%); width:520px; height:520px; background:radial-gradient(circle, rgba(255,209,102,.13), transparent 62%); pointer-events:none; }
.hero-emoji { font-size:3.4rem; margin-bottom:10px; filter:drop-shadow(0 6px 18px rgba(255,209,102,.35)); }
.hero-title {
  font-size:2.5rem; font-weight:900; line-height:1.1; margin-bottom:6px;
  background:linear-gradient(90deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%); background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:titleShine 5s linear infinite;
}
@keyframes titleShine { to { background-position:200% center; } }
.hero-sub { color:var(--text2); font-size:1.05rem; margin-bottom:8px; }
.hero-desc { color:var(--text3); font-size:.9rem; line-height:1.65; max-width:520px; margin:0 auto 26px; }
.hero-stats { display:flex; justify-content:center; gap:26px; margin-bottom:26px; flex-wrap:wrap; }
.stat { text-align:center; }
.stat-val { font-size:1.5rem; font-weight:900; color:var(--gold); font-family:'Space Mono',monospace; }
.stat-lbl { font-size:.74rem; color:var(--text3); }

/* ===== HUB / PATH ===== */
.hub-head { text-align:center; margin:6px 0 18px; }
.hub-head h2 { font-size:1.5rem; font-weight:900; }
.hub-head p { color:var(--text2); font-size:.9rem; margin-top:4px; }
.path { position:relative; padding:6px 0; }
.path::before { content:''; position:absolute; top:0; bottom:0; left:50%; width:3px; transform:translateX(-50%); background:repeating-linear-gradient(to bottom, var(--border) 0 10px, transparent 10px 20px); }
.path-item { position:relative; display:flex; align-items:center; margin:0 0 14px; }
.path-item .node {
  position:absolute; left:50%; transform:translateX(-50%); width:42px; height:42px; border-radius:50%; border:3px solid var(--border);
  background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-weight:700; font-size:.85rem; z-index:2; color:var(--text2);
}
.path-item.done .node { border-color:var(--accent); color:var(--accent); background:rgba(34,214,138,.12); box-shadow:0 0 16px rgba(34,214,138,.35); }
.path-item.next .node { border-color:var(--gold); color:var(--gold); background:rgba(255,209,102,.12); box-shadow:0 0 18px rgba(255,209,102,.5); animation:nodePulse 1.6s ease-in-out infinite; }
@keyframes nodePulse { 0%,100% { box-shadow:0 0 12px rgba(255,209,102,.35); } 50% { box-shadow:0 0 26px rgba(255,209,102,.75); } }
.level-card {
  width:calc(50% - 34px); background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; cursor:pointer; transition:.25s; display:flex; align-items:center; gap:12px; position:relative; z-index:1;
}
.path-item:nth-child(odd) .level-card { margin-right:auto; }
.path-item:nth-child(even) .level-card { margin-left:auto; }
.level-card:hover:not(.locked) { border-color:var(--gold); transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.35); }
.level-card.locked { opacity:.42; cursor:not-allowed; }
.level-card.done { border-color:rgba(34,214,138,.35); background:rgba(34,214,138,.05); }
.level-card.next { border-color:rgba(255,209,102,.5); background:rgba(255,209,102,.05); }
.level-icon { font-size:1.6rem; flex-shrink:0; }
.level-name { font-weight:700; font-size:.95rem; line-height:1.25; }
.level-desc { font-size:.76rem; color:var(--text2); margin-top:2px; }
.level-meta { font-size:.72rem; color:var(--text3); margin-top:5px; font-family:'Space Mono',monospace; }
.level-stars { font-size:.85rem; letter-spacing:1px; }

/* ===== TROPHY CASE ===== */
.trophies { margin-top:26px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:18px; }
.trophies h3 { font-size:1rem; font-weight:800; margin-bottom:4px; }
.trophies p { font-size:.8rem; color:var(--text2); margin-bottom:12px; }
.badge-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px; }
.badge-tile {
  text-align:center; padding:12px 6px 10px; border-radius:12px; background:var(--bg3); border:1px solid var(--border); transition:.3s;
}
.badge-tile .b-icon { font-size:1.7rem; display:block; margin-bottom:4px; }
.badge-tile .b-name { font-size:.72rem; font-weight:700; line-height:1.2; }
.badge-tile .b-desc { font-size:.64rem; color:var(--text3); margin-top:3px; line-height:1.25; }
.badge-tile.locked { opacity:.45; filter:grayscale(1); }
.badge-tile.unlocked { border-color:rgba(255,209,102,.5); background:rgba(255,209,102,.07); box-shadow:0 0 16px rgba(255,209,102,.15) inset; }

/* ===== BRIEFING ===== */
.brief-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.brief-head .b-ico { font-size:2.4rem; }
.brief-head h2 { font-size:1.4rem; font-weight:900; line-height:1.2; }
.brief-head .b-sub { color:var(--text2); font-size:.85rem; }
.objectives { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; }
.objectives h4 { font-size:.85rem; font-weight:800; color:var(--gold); margin-bottom:8px; }
.objectives li { list-style:none; font-size:.88rem; padding:4px 0 4px 26px; position:relative; line-height:1.45; }
.objectives li::before { content:'✔'; position:absolute; left:4px; color:var(--accent); font-weight:900; }
.theory {
  background:linear-gradient(135deg, rgba(77,155,255,.07), rgba(167,139,250,.05)); border:1px solid rgba(77,155,255,.2);
  border-radius:var(--radius); padding:20px 22px; margin-bottom:16px;
}
.theory h3 { font-size:1.05rem; font-weight:800; color:var(--blue); margin-bottom:10px; }
.theory-text { font-size:.92rem; line-height:1.7; }
.theory-text b { color:var(--accent); }
.theory-text p { margin:0 0 10px; }
.theory-text p:last-child { margin:0; }
.theory-text ul { padding-left:20px; margin:4px 0 10px; }
.theory-text li { margin:3px 0; }
.mini-table { width:100%; border-collapse:collapse; font-size:.85rem; margin:8px 0 10px; }
.mini-table th { text-align:left; padding:8px 10px; background:rgba(77,155,255,.12); color:var(--text2); font-weight:700; font-size:.78rem; }
.mini-table td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
.mini-table td:first-child { font-weight:800; color:var(--gold); white-space:nowrap; }
.example { background:rgba(255,138,61,.07); border:1px solid rgba(255,138,61,.2); border-radius:12px; padding:14px 18px; margin:14px 0 0; }
.example .ex-t { font-weight:800; color:var(--orange); font-size:.86rem; margin-bottom:6px; }
.example .ex-c { font-size:.88rem; line-height:1.6; }
.bonus { background:rgba(255,209,102,.06); border:1px solid rgba(255,209,102,.3); border-radius:12px; padding:14px 18px; margin:14px 0 0; }
.bonus .ex-t { font-weight:800; color:var(--gold); font-size:.86rem; margin-bottom:6px; }
.bonus .ex-c { font-size:.88rem; line-height:1.6; }
.predict { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:18px; text-align:center; }
.predict h4 { font-size:.9rem; font-weight:800; margin-bottom:4px; }
.predict p { font-size:.8rem; color:var(--text2); margin-bottom:10px; }
.chips { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.chip {
  padding:9px 16px; border-radius:20px; border:1.5px solid var(--border); background:var(--bg3); color:var(--text); font-weight:700;
  font-size:.86rem; cursor:pointer; transition:.2s;
}
.chip:hover { border-color:var(--gold); }
.chip.sel { border-color:var(--gold); background:rgba(255,209,102,.15); color:var(--gold); }

/* ===== SANDBOX ===== */
.lab { background:var(--bg2); border:1px solid rgba(167,139,250,.35); border-radius:var(--radius); padding:16px 18px; margin:14px 0 0; }
.lab h4 { font-size:.92rem; font-weight:800; color:var(--purple); margin-bottom:4px; }
.lab p { font-size:.8rem; color:var(--text2); margin-bottom:12px; }
.lab-row { display:grid; grid-template-columns:150px 1fr 120px; gap:10px; align-items:center; margin:8px 0; font-size:.84rem; }
.lab-row input[type=range] { width:100%; accent-color:var(--purple); }
.lab-val { font-family:'Space Mono',monospace; font-weight:700; text-align:right; font-size:.8rem; }
.lab-val.over { color:var(--error); }
.lab-result { margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--bg3); border:1px solid var(--border); font-size:.9rem; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.lab-badge { font-weight:900; padding:6px 14px; border-radius:20px; font-size:.9rem; }
.lab-badge.ge { background:rgba(255,77,109,.15); color:var(--error); border:1px solid rgba(255,77,109,.4); }
.lab-badge.pe { background:rgba(77,155,255,.15); color:var(--blue); border:1px solid rgba(77,155,255,.4); }
.lab-badge.micro { background:rgba(34,214,138,.15); color:var(--accent); border:1px solid rgba(34,214,138,.4); }
.lab-check { display:flex; align-items:center; gap:8px; font-size:.84rem; margin-top:6px; }

/* ===== QUESTION ===== */
.q-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:.8rem; color:var(--text2); }
.q-top b { color:var(--gold); }
.q-dots { display:flex; gap:5px; }
.q-dots span { width:9px; height:9px; border-radius:50%; background:var(--border); }
.q-dots span.c { background:var(--success); }
.q-dots span.h { background:var(--warning); }
.q-dots span.s { background:var(--error); }
.q-dots span.cur { background:var(--gold); box-shadow:0 0 8px var(--gold); }
.q-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; position:relative; overflow:hidden; }
.q-type { font-size:.74rem; color:var(--text3); margin-bottom:8px; }
.q-text { font-size:1.06rem; font-weight:600; line-height:1.55; margin-bottom:18px; }
.q-text .data { display:inline-block; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin:8px 0 0; font-size:.92rem; font-weight:500; line-height:1.6; }
.q-text .data b { color:var(--gold); font-family:'Space Mono',monospace; font-size:.86rem; }
.q-card.shake { animation:shake .45s; }
@keyframes shake { 10%,90% { transform:translateX(-2px); } 20%,80% { transform:translateX(3px); } 30%,50%,70% { transform:translateX(-5px); } 40%,60% { transform:translateX(5px); } }

/* QCM */
.options { display:flex; flex-direction:column; gap:10px; }
.opt {
  background:var(--bg2); border:1.5px solid var(--border); border-radius:12px; padding:13px 16px; cursor:pointer; transition:.22s;
  font-size:.93rem; text-align:left; display:flex; align-items:center; gap:12px; color:var(--text);
}
.opt:hover:not(.dis) { border-color:var(--accent); background:rgba(34,214,138,.05); transform:translateX(3px); }
.opt .letter { width:30px; height:30px; border-radius:9px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.8rem; color:var(--text2); flex-shrink:0; font-family:'Space Mono',monospace; }
.opt.ok { border-color:var(--success); background:rgba(34,214,138,.1); }
.opt.ok .letter { background:var(--success); color:var(--bg); }
.opt.ko { border-color:var(--error); background:rgba(255,77,109,.07); }
.opt.ko .letter { background:var(--error); color:#fff; }
.opt.dis { pointer-events:none; }
.opt.dis:not(.ok):not(.ko) { opacity:.55; }
.opt.chk .letter { background:var(--gold); color:var(--bg); }
.opt.chk { border-color:var(--gold); background:rgba(255,209,102,.08); }
.opt.chk.ok { border-color:var(--success); background:rgba(34,214,138,.1); }
.opt.miss { border-color:var(--warning); border-style:dashed; }

/* VF */
.vf { display:flex; gap:12px; }
.vf-btn { flex:1; padding:15px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg2); cursor:pointer; font-weight:800; font-size:1rem; color:var(--text); transition:.22s; }
.vf-btn:hover:not(.dis) { border-color:var(--accent); transform:translateY(-2px); }
.vf-btn.ok { border-color:var(--success); background:rgba(34,214,138,.12); color:var(--success); }
.vf-btn.ko { border-color:var(--error); background:rgba(255,77,109,.08); color:var(--error); }
.vf-btn.dis { pointer-events:none; }

/* INPUT */
.inp-wrap { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.inp {
  flex:1; min-width:200px; padding:13px 16px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg2); color:var(--text);
  font-family:'Space Mono',monospace; font-size:1rem; outline:none; transition:.2s;
}
.inp:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,214,138,.12); }
.inp.ok { border-color:var(--success); }
.inp.ko { border-color:var(--error); }
.inp-unit { font-weight:800; color:var(--text2); }
.calc-preview { margin-top:8px; font-family:'Space Mono',monospace; font-size:.8rem; color:var(--purple); min-height:1.2em; }

/* CLASSIFY */
.pool-label { font-size:.78rem; color:var(--text3); margin-bottom:8px; }
.pool { display:flex; flex-wrap:wrap; gap:8px; min-height:44px; padding:10px; border-radius:12px; background:var(--bg2); border:1px dashed var(--border); }
.tag {
  padding:8px 13px; border-radius:9px; font-size:.83rem; font-weight:600; cursor:pointer; transition:.2s; user-select:none;
  background:var(--bg3); border:1.5px solid var(--border);
}
.tag:hover { border-color:var(--accent); transform:scale(1.04); }
.tag.sel { border-color:var(--gold); background:rgba(255,209,102,.15); color:var(--gold); box-shadow:0 0 10px rgba(255,209,102,.3); }
.tag.c1 { border-color:var(--success); background:rgba(34,214,138,.12); cursor:default; }
.tag.c2 { border-color:var(--warning); background:rgba(255,179,71,.12); cursor:default; }
.tag.x { border-color:var(--error); background:rgba(255,77,109,.1); cursor:default; }
.tag.bounce { animation:bounceBack .5s; }
@keyframes bounceBack { 0% { transform:scale(1.15); border-color:var(--error); } 100% { transform:scale(1); } }
.zones { display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px; }
@media(min-width:600px) { .zones { grid-template-columns:repeat(3,1fr); } .zones.two { grid-template-columns:repeat(2,1fr); } }
.zone { background:var(--card); border:2px dashed var(--border); border-radius:var(--radius); padding:12px; min-height:110px; transition:.25s; cursor:pointer; }
.zone.target { border-color:var(--gold); background:rgba(255,209,102,.05); }
.zone.z-primaire .z-t { color:#4ade80; } .zone.z-secondaire .z-t { color:var(--orange); } .zone.z-tertiaire .z-t { color:var(--blue); }
.z-t { font-weight:800; font-size:.84rem; text-align:center; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.z-items { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.z-items .tag { font-size:.78rem; padding:6px 10px; }
.fix { font-size:.7rem; color:var(--error); display:block; font-weight:600; }

/* MATCH */
.match { display:flex; flex-direction:column; gap:10px; }
.m-row { display:flex; align-items:center; gap:10px; }
.m-term { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:12px; font-weight:700; font-size:.9rem; }
.m-sel { flex:1.4; padding:12px; border-radius:10px; border:1.5px solid var(--border); background:var(--bg2); color:var(--text); font-family:inherit; font-size:.86rem; cursor:pointer; }
.m-sel.c1 { border-color:var(--success); background:rgba(34,214,138,.1); }
.m-sel.c2 { border-color:var(--warning); background:rgba(255,179,71,.1); }
.m-sel.x { border-color:var(--error); background:rgba(255,77,109,.08); }

/* ORDER / CLOZE slots */
.slots { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.slot {
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:1.5px dashed var(--border); background:var(--card); min-height:48px; cursor:pointer; transition:.2s; font-size:.9rem;
}
.slot .num { width:26px; height:26px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:.75rem; color:var(--text2); flex-shrink:0; }
.slot.filled { border-style:solid; border-color:var(--text3); }
.slot.c1 { border-color:var(--success); background:rgba(34,214,138,.08); cursor:default; }
.slot.c2 { border-color:var(--warning); background:rgba(255,179,71,.08); cursor:default; }
.slot.x { border-color:var(--error); background:rgba(255,77,109,.06); cursor:default; }
.slot .arrow { margin-left:auto; color:var(--text3); font-size:.8rem; }
.cloze-text { font-size:.98rem; line-height:2.1; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
.blank {
  display:inline-block; min-width:110px; padding:2px 10px; border-radius:8px; border:1.5px dashed var(--text3); margin:0 2px; text-align:center; cursor:pointer;
  font-weight:700; line-height:1.6; vertical-align:middle; transition:.2s; background:var(--bg3); font-size:.9rem;
}
.blank.sel { border-color:var(--gold); border-style:solid; box-shadow:0 0 10px rgba(255,209,102,.35); }
.blank.filled { border-style:solid; border-color:var(--text2); color:var(--text); }
.blank.c1 { border-color:var(--success); color:var(--success); cursor:default; }
.blank.c2 { border-color:var(--warning); color:var(--warning); cursor:default; }
.blank.x { border-color:var(--error); color:var(--error); cursor:default; }

/* ERRORS */
.hunt { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:16px 18px; font-size:.95rem; line-height:1.9; }
.seg { cursor:pointer; padding:2px 4px; border-radius:6px; transition:.2s; border-bottom:2px solid transparent; }
.seg:hover { background:rgba(255,209,102,.1); }
.seg.flag { background:rgba(255,209,102,.18); border-bottom-color:var(--gold); }
.seg.c1 { background:rgba(34,214,138,.15); border-bottom-color:var(--success); cursor:default; }
.seg.c2 { background:rgba(255,179,71,.15); border-bottom-color:var(--warning); cursor:default; }
.seg.x { background:rgba(255,77,109,.14); border-bottom-color:var(--error); cursor:default; text-decoration:line-through; }
.seg.fa { animation:bounceBack .5s; }
.seg .corr { display:block; font-size:.8rem; color:var(--accent); font-style:italic; line-height:1.4; margin:2px 0 6px; }
.hunt-count { font-size:.8rem; color:var(--text2); margin-top:10px; }

/* MISSION SETUP */
.projects { display:grid; grid-template-columns:1fr; gap:10px; margin:6px 0 16px; }
@media(min-width:560px) { .projects { grid-template-columns:repeat(3,1fr); } }
.proj { background:var(--bg2); border:1.5px solid var(--border); border-radius:14px; padding:16px 12px; text-align:center; cursor:pointer; transition:.22s; }
.proj:hover { border-color:var(--gold); transform:translateY(-3px); }
.proj.sel { border-color:var(--gold); background:rgba(255,209,102,.1); box-shadow:0 0 18px rgba(255,209,102,.25); }
.proj .p-ico { font-size:2rem; }
.proj .p-name { font-weight:800; font-size:.9rem; margin:6px 0 4px; }
.proj .p-desc { font-size:.76rem; color:var(--text2); line-height:1.4; }

/* FEEDBACK */
.feedback { padding:14px 18px; border-radius:12px; margin-top:16px; font-size:.9rem; line-height:1.55; display:none; animation:fadeIn .3s; }
.feedback.show { display:block; }
.feedback.ok { background:rgba(34,214,138,.09); border:1px solid rgba(34,214,138,.25); color:var(--success); }
.feedback.hint { background:rgba(255,179,71,.09); border:1px solid rgba(255,179,71,.25); color:var(--warning); }
.feedback.ko { background:rgba(255,77,109,.07); border:1px solid rgba(255,77,109,.2); color:var(--error); }
.feedback .fb-x { color:var(--text2); font-size:.85rem; display:block; margin-top:5px; }
.next-wrap { text-align:center; margin-top:18px; display:none; }
.next-wrap.show { display:block; }

/* BILAN */
.bilan { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:30px 24px; text-align:center; position:relative; overflow:hidden; }
.bilan::before { content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%, rgba(255,209,102,.12), transparent 55%); pointer-events:none; }
.medal { font-size:4rem; display:inline-block; position:relative; margin-bottom:6px; animation:medalPop .7s cubic-bezier(.34,1.56,.64,1); }
@keyframes medalPop { from { transform:scale(0) rotate(-20deg); opacity:0; } to { transform:scale(1) rotate(0); opacity:1; } }
.glitter { position:absolute; inset:-30px; pointer-events:none; }
.glitter i { position:absolute; width:6px; height:6px; border-radius:50%; background:var(--gold); animation:twinkle 1.6s ease-in-out infinite; opacity:0; box-shadow:0 0 8px var(--gold); }
@keyframes twinkle { 0%,100% { opacity:0; transform:scale(.3); } 50% { opacity:1; transform:scale(1.2); } }
.grade { font-size:1.7rem; font-weight:900; }
.bilan-msg { color:var(--text2); font-size:.9rem; margin:6px 0 4px; }
.stars-big { font-size:1.6rem; letter-spacing:4px; margin:6px 0 14px; }
.legend { display:flex; justify-content:center; gap:18px; margin-bottom:14px; font-size:.8rem; flex-wrap:wrap; }
.legend span { display:flex; align-items:center; gap:6px; }
.dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
.dot.g { background:var(--success); } .dot.o { background:var(--warning); } .dot.r { background:var(--error); }
.bilan-table { width:100%; border-collapse:collapse; margin-bottom:16px; text-align:center; font-size:.86rem; }
.bilan-table th { padding:9px 6px; color:var(--text2); font-weight:600; border-bottom:1px solid var(--border); font-size:.76rem; }
.bilan-table td { padding:9px 6px; border-bottom:1px solid rgba(255,255,255,.04); }
.bilan-table td:first-child { text-align:left; }
.pred-res { font-size:.86rem; margin:6px 0 14px; padding:10px 14px; border-radius:10px; background:var(--bg2); border:1px solid var(--border); color:var(--text2); }
.pred-res b { color:var(--gold); }
.xp-gain { font-family:'Space Mono',monospace; font-size:1.3rem; font-weight:700; color:var(--accent); margin:2px 0 10px; }

/* FICHE */
.fiche { margin:18px auto 0; max-width:440px; background:#fbfaf6; color:#1a1d29; border-radius:14px; padding:22px 24px; text-align:left; border:1px solid #d9d3c2; position:relative; box-shadow:0 12px 40px rgba(0,0,0,.4); }
.fiche::before { content:''; position:absolute; top:0; left:0; right:0; height:8px; border-radius:14px 14px 0 0; background:linear-gradient(90deg,#22d68a,#ffd166,#22d68a); }
.fiche h3 { font-size:.78rem; color:#6b7288; font-weight:700; margin-bottom:2px; }
.fiche .f-name { font-size:1.4rem; font-weight:900; color:#0c0f1a; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.fiche table { width:100%; border-collapse:collapse; font-size:.86rem; }
.fiche td { padding:6px 0; border-bottom:1px dashed #e2ddcd; vertical-align:top; }
.fiche td:first-child { color:#6b7288; width:44%; }
.fiche td:last-child { font-weight:700; color:#1a1d29; }
.fiche .f-foot { margin-top:12px; font-size:.72rem; color:#6b7288; display:flex; justify-content:space-between; }
.fiche .stamp { position:absolute; right:18px; bottom:44px; border:3px solid #22d68a; color:#22d68a; font-weight:900; padding:4px 10px; border-radius:8px; transform:rotate(-10deg); font-size:.8rem; opacity:.85; }

/* ===== EFFECTS ===== */
.spark { position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:9999; animation:sparkFly .8s ease-out forwards; }
@keyframes sparkFly { 0% { transform:translate(0,0) scale(1); opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }
.float-pts { position:fixed; font-family:'Space Mono',monospace; font-weight:700; color:var(--accent); font-size:1.1rem; pointer-events:none; z-index:9999; animation:floatUp 1.1s ease-out forwards; text-shadow:0 0 10px rgba(34,214,138,.7); }
@keyframes floatUp { 0% { transform:translateY(0); opacity:1; } 100% { transform:translateY(-70px); opacity:0; } }
.confetti { position:fixed; width:10px; height:10px; z-index:99999; pointer-events:none; top:-20px; animation:confettiFall 3s ease-out forwards; }
@keyframes confettiFall { 0% { transform:translateY(0) rotate(0); opacity:1; } 100% { transform:translateY(105vh) rotate(760deg); opacity:0; } }
.toast {
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120px); z-index:20000; opacity:0; visibility:hidden;
  background:linear-gradient(135deg, #1b2238, #141a2b); border:1px solid rgba(255,209,102,.6); border-radius:14px; padding:12px 18px;
  display:flex; align-items:center; gap:12px; box-shadow:0 10px 40px rgba(0,0,0,.5), 0 0 24px rgba(255,209,102,.25);
  transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .4s, visibility .5s; max-width:92vw; overflow:hidden;
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; visibility:visible; }
.toast::after { content:''; position:absolute; top:0; bottom:0; width:60px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent); animation:sweep 1.4s .3s ease-in-out 2; left:-80px; }
@keyframes sweep { to { left:110%; } }
.toast .t-ico { font-size:1.8rem; }
.toast .t-title { font-size:.72rem; color:var(--gold); font-weight:800; }
.toast .t-name { font-weight:800; font-size:.95rem; }
.toast .t-desc { font-size:.76rem; color:var(--text2); }
.rankup { position:fixed; inset:0; z-index:15000; display:none; align-items:center; justify-content:center; background:rgba(12,15,26,.82); backdrop-filter:blur(6px); }
.rankup.show { display:flex; }
.rankup .rays { position:absolute; width:900px; height:900px; background:conic-gradient(from 0deg, rgba(255,209,102,.18) 0 12deg, transparent 12deg 30deg); border-radius:50%; animation:spin 12s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.rankup .card { position:relative; text-align:center; background:var(--bg2); border:1px solid rgba(255,209,102,.6); border-radius:24px; padding:36px 40px; animation:medalPop .7s cubic-bezier(.34,1.56,.64,1); box-shadow:0 0 60px rgba(255,209,102,.3); }
.rankup .r-ico { font-size:4rem; }
.rankup .r-lbl { color:var(--gold); font-weight:800; font-size:.8rem; margin-top:6px; }
.rankup .r-name { font-size:1.8rem; font-weight:900; margin:4px 0 14px; }
.combo { position:fixed; top:110px; left:50%; transform:translateX(-50%) scale(.5); z-index:9998; font-weight:900; font-size:1.6rem; color:var(--orange); pointer-events:none; opacity:0; text-shadow:0 0 18px rgba(255,138,61,.8); animation:comboPop 1.3s ease-out forwards; }
@keyframes comboPop { 0% { transform:translateX(-50%) scale(.5); opacity:0; } 20% { transform:translateX(-50%) scale(1.2); opacity:1; } 70% { transform:translateX(-50%) scale(1); opacity:1; } 100% { transform:translateX(-50%) scale(1) translateY(-30px); opacity:0; } }

/* ===== MODALS ===== */
.overlay { display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.75); backdrop-filter:blur(8px); align-items:center; justify-content:center; }
.overlay.show { display:flex; }
.modal { background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:30px; width:92%; max-width:440px; text-align:center; box-shadow:0 0 40px rgba(0,0,0,.5); animation:slideUp .35s ease; position:relative; }
.modal.wide { max-width:620px; max-height:85vh; overflow-y:auto; text-align:left; }
@keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:none; opacity:1; } }
.modal h2 { font-size:1.3rem; margin-bottom:4px; }
.modal p { font-size:.85rem; color:var(--text2); margin-bottom:18px; }
.modal input { width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg3); color:var(--text); font-size:1rem; outline:none; margin-bottom:12px; font-family:inherit; }
.close-x { position:absolute; top:10px; right:12px; background:none; border:none; color:var(--text2); font-size:1.5rem; cursor:pointer; }

/* ===== RESPONSIVE ===== */
@media(max-width:768px) {
  .level-card { width:calc(50% - 28px); }
}
@media(max-width:560px) {
  .path::before { left:20px; }
  .path-item .node { left:20px; width:36px; height:36px; font-size:.75rem; }
  .level-card { width:calc(100% - 56px); margin-left:56px !important; margin-right:0 !important; }
  .hero-title { font-size:1.9rem; }
  .hero { padding:32px 18px 26px; }
  .m-row { flex-direction:column; align-items:stretch; }
  .lab-row { grid-template-columns:1fr; gap:4px; }
  .lab-val { text-align:left; }
  .brand-title { font-size:.9rem; }
  .pill { font-size:.72rem; padding:4px 9px; }
  .q-card { padding:16px; }
  .theory { padding:16px; }
  .legend { gap:10px; }
}
@media(max-width:480px) { .brand-tag { display:none; } .brand-title { display:none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
@media print {
  body * { visibility:hidden; }
  .fiche, .fiche * { visibility:visible; }
  .fiche { position:absolute; left:0; top:0; width:100%; box-shadow:none; }
}
</style>

<body>

<header class="app-header">

  </div>
</div>

<script>
// ============================================================
// DONNÉES — Rangs, badges, projets de la mission finale
// ============================================================
const RANKS = [
  { min:0,   icon:'🎒', name:'Stagiaire' },
  { min:60,  icon:'🧑‍💼', name:'Employé' },
  { min:130, icon:'🧮', name:'Chef comptable' },

const BADGES = [
  { id:'first',     icon:'🚀', name:'Premier pas',      desc:'Terminer la mission 1' },
  { id:'perfect',   icon:'💎', name:'Sans faute',       desc:'Une mission réussie à 100 % du premier coup' },
  { id:'streak5',   icon:'🔥', name:'En feu',           desc:'5 bonnes réponses d\'affilée' },
  { id:'streak10',  icon:'⚡', name:'Inarrêtable',      desc:'10 bonnes réponses d\'affilée' },
  { id:'tva',       icon:'🧾', name:'Expert TVA',       desc:'Numéro de TVA correct du premier coup' },
  { id:'trieur',    icon:'🎯', name:'Trieur d\'élite',   desc:'12 entreprises classées sans erreur' },
  { id:'detective', icon:'🕵️', name:'Détective',        desc:'Toutes les erreurs trouvées, aucune fausse alerte' },
  { id:'lynx',      icon:'📏', name:'Œil de lynx',      desc:'Mission « Taille des sociétés » à 85 % ou plus' },
  { id:'oracle',    icon:'🔮', name:'Oracle',           desc:'Prédire correctement son résultat' },
  { id:'founder',   icon:'🏛️', name:'Fondateur',        desc:'Créer sa propre entreprise (mission 9)' },
  { id:'marathon',  icon:'🏁', name:'Marathonien',      desc:'Les 9 missions terminées' },
  { id:'legend',    icon:'👑', name:'Légende',          desc:'85 % ou plus sur l\'ensemble du parcours' }
];

const PROJECTS = {
  choco: { icon:'🍫', name:'Chocolaterie artisanale', desc:'Tu fabriques tes propres pralines dans ton atelier et tu les vends dans ta boutique.' },
  velo:  { icon:'🚲', name:'Atelier vélo',            desc:'Tu répares les vélos de tes clients et tu leur vends des accessoires (casques, lampes, antivols).' },
  ferme: { icon:'🌱', name:'Ferme urbaine',           desc:'Tu cultives des légumes et des herbes aromatiques que tu livres à des restaurants.' }

// ---- Rotation déterministe des propositions de QCM (règle 3.7) ----
const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(){
  let k = 0;
  const rot = q => {
    if (q.type !== 'qcm' || !q.options) return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++) { q.options.unshift(q.options.pop()); q.correct = (q.correct + 1) % q.options.length; }
  };
  LEVELS.forEach(lv => lv.questions.forEach(q => {
    if (q.variants) Object.values(q.variants).forEach(v => rot(Object.assign(v, {type:q.type})));
    else rot(q);
  }));
})();
LEVELS.forEach(lv => { lv.maxPoints = lv.questions.reduce((s,q) => s + q.pts, 0); });
const TOTAL_XP = LEVELS.reduce((s,lv) => s + lv.maxPoints, 0);
const TOTAL_Q  = LEVELS.reduce((s,lv) => s + lv.questions.length, 0);

const APP = {
  screen:'welcome', level:null, q:0,
  score:0, streak:0, maxStreak:0,
  completed:new Set(), results:{}, qs:{}, predictions:{}, levelStart:{},
  badges:new Set(), rankIdx:0, sound:false,
  mission:{ project:null, name:'', city:'' },
  // Tracking
  email: localStorage.getItem('student_email') || '',
  classe: localStorage.getItem('student_classe') || '',
  globalTimerStart:null, globalTimerInterval:null, completedExercises:[],
  // Reprise : passe à true si la feuille Google a déjà un résultat pour cet élève
  unlockAll:false
};

function getQ(lv, q) {
  const raw = LEVELS[lv].questions[q];
  if (raw.variants) return Object.assign({}, raw, raw.variants[APP.mission.project || 'choco']);
  return raw;
}
function stateOf(lv, q) {
  const k = lv + '_' + q;
  if (!APP.qs[k]) APP.qs[k] = { attempt:0, done:false };
  return APP.qs[k];
}
function fmtNum(n) {
  return new Intl.NumberFormat('fr-BE', { maximumFractionDigits:2 }).format(n);
}
function firstName() {
  if (!APP.email) return 'toi';
  return APP.email.split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

// ============================================================
// HUD : XP, rang, série, navigation
// ============================================================
function rankFor(score) { let r = 0; RANKS.forEach((rk, i) => { if (score >= rk.min) r = i; }); return r; }

function updateHUD() {
  document.getElementById('xpPill').textContent = APP.score + ' XP';
  const sp = document.getElementById('streakPill');
  sp.textContent = '🔥 ' + APP.streak;
  sp.classList.toggle('hot', APP.streak >= 3);
  const rk = RANKS[APP.rankIdx];
  document.getElementById('rankLabel').textContent = rk.icon + ' ' + rk.name;
  const next = RANKS[APP.rankIdx + 1];
  document.getElementById('xpLabel').textContent = APP.score + '/' + TOTAL_XP + ' XP' + (next ? ' — prochain rang à ' + next.min + ' XP' : ' — rang maximum !');
  document.getElementById('xpFill').style.width = Math.min(100, APP.score / TOTAL_XP * 100) + '%';
  const ticks = document.getElementById('xpTicks');
  if (!ticks.children.length) RANKS.slice(1).forEach(rk => { const t = document.createElement('div'); t.className = 'xp-tick'; t.style.left = (rk.min / TOTAL_XP * 100) + '%'; ticks.appendChild(t); });
}

function rankCheck() {
  const r = rankFor(APP.score);
  if (r > APP.rankIdx) {
    APP.rankIdx = r;
    updateHUD();
    setTimeout(() => showRankUp(RANKS[r]), 500);
  }
}

// Dès qu'une mission est terminée, TOUTES les missions sont débloquées :
// l'élève qui revient peut choisir librement et reprendre là où il s'était arrêté.
function isLocked(i) { return i > 0 && !APP.unlockAll && APP.completed.size === 0; }

function renderNav() {
  const strip = document.getElementById('navStrip');
  strip.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const d = document.createElement('div');
    d.className = 'nav-dot' + (APP.completed.has(i) ? ' completed' : '') + (APP.level === i && APP.screen !== 'hub' && APP.screen !== 'welcome' ? ' active' : '') + (isLocked(i) ? ' locked' : '');
    d.textContent = APP.completed.has(i) ? '✓' : (isLocked(i) ? '🔒' : (i + 1));
    d.title = lv.title;
    if (!isLocked(i)) d.onclick = () => openLevel(i);
    strip.appendChild(d);
  });
}

function setScreen(name) {
  APP.screen = name;
  renderScreen();
  renderNav();
  window.scrollTo({ top:0, behavior:'smooth' });
}

function renderScreen() {
  const m = document.getElementById('main');
  switch (APP.screen) {
    case 'welcome': m.innerHTML = renderWelcome(); break;
    case 'hub': m.innerHTML = renderHub(); break;
    case 'brief': m.innerHTML = renderBrief(APP.level); if (LEVELS[APP.level].theory.sandbox) labUpdate(); break;
    case 'setup': m.innerHTML = renderSetup(); break;
    case 'question': m.innerHTML = renderQuestion(APP.level, APP.q); afterRenderQuestion(); break;
    case 'bilan': m.innerHTML = renderBilan(APP.level); break;
  }
  updateHUD();
}

// ============================================================
// PARCOURS (HUB)
// ============================================================
function levelPct(i) {
  const r = APP.results[i] || [];
  return r.length ? Math.round(r.filter(x => x.status === 'correct').length / r.length * 100) : 0;
}
function levelXP(i) { return (APP.results[i] || []).reduce((s, x) => s + x.pts, 0); }
function starsFor(pct) { const n = pct >= 85 ? 3 : pct >= 65 ? 2 : pct >= 45 ? 1 : 0; return '★'.repeat(n) + '☆'.repeat(3 - n); }

function renderHub() {
  const allDone = APP.completed.size === LEVELS.length;
  let nextIdx = LEVELS.findIndex((_, i) => !APP.completed.has(i));
  let html = `<div class="screen">`;
  if (allDone) html += renderFinal();
  const freeChoice = APP.completed.size > 0 || APP.unlockAll;
  html += `<div class="hub-head"><h2>${allDone ? 'Parcours terminé' : 'Ton parcours'}</h2><p>${allDone ? 'Tu peux revoir chaque mission ou rejouer pour améliorer ton score.' : freeChoice ? 'Toutes les missions sont débloquées : clique sur celle que tu veux, par exemple celle où tu t\'étais arrêté(e).' : 'Les missions se débloquent dans l\'ordre. Chaque mission terminée rapporte des XP et des étoiles.'}</p></div>`;
  html += `<div class="path">`;
  LEVELS.forEach((lv, i) => {
    const done = APP.completed.has(i), locked = isLocked(i), isNext = i === nextIdx;
    const cls = done ? 'done' : isNext ? 'next' : locked ? 'locked' : '';
    const pct = levelPct(i);
    html += `<div class="path-item ${cls}">
      <div class="node">${done ? '✓' : locked ? '🔒' : (i + 1)}</div>
      <div class="level-card ${cls}" ${locked ? '' : `onclick="openLevel(${i})"`}>
        <div class="level-icon">${lv.icon}</div>
        <div style="flex:1;min-width:0;">
          <div class="level-name">${lv.title}</div>
          <div class="level-desc">${lv.desc}</div>
          <div class="level-meta">${done ? `<span class="level-stars" style="color:var(--gold)">${starsFor(pct)}</span> ${levelXP(i)}/${lv.maxPoints} XP` : `${lv.questions.length} questions — ${lv.maxPoints} XP`}</div>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;
  html += renderTrophies();
  html += `</div>`;
  return html;
}

function renderTrophies() {
  return `<div class="trophies">
    <h3>🏅 Vitrine à trophées — ${APP.badges.size}/${BADGES.length}</h3>
    <p>Chaque badge récompense un exploit précis. Survole pour voir comment l'obtenir.</p>
    <div class="badge-grid">${BADGES.map(b => `<div class="badge-tile ${APP.badges.has(b.id) ? 'unlocked' : 'locked'}" title="${b.desc}"><span class="b-icon">${APP.badges.has(b.id) ? b.icon : '❔'}</span><div class="b-name">${b.name}</div><div class="b-desc">${b.desc}</div></div>`).join('')}</div>
  </div>`;
}

function openLevel(i) {
  if (isLocked(i)) return;
  APP.level = i;
  if (APP.completed.has(i)) { setScreen('bilan'); return; }
  if (APP.levelStart[i] !== undefined) {
    // reprise : on repart à la première question non terminée DE CETTE mission
    const n = LEVELS[i].questions.length;
    let r = 0; while (r < n - 1 && APP.qs[i + '_' + r] && APP.qs[i + '_' + r].done) r++;
    APP.q = r;
    setScreen('question'); return;
  }
  setScreen('brief');
}

function predict(i, v) { APP.predictions[i] = v; renderScreen(); }

function startLevel(i) {
  if (!APP.predictions[i]) APP.predictions[i] = 'none';
  if (APP.levelStart[i] === undefined) { APP.levelStart[i] = Date.now(); startExerciseTimer(i); }
  APP.q = 0;
  if (LEVELS[i].theory.setup && !APP.mission.project) { setScreen('setup'); return; }
  setScreen('question');
}

function labUpdate() {
  const w = document.getElementById('labW'); if (!w) return;
  const W = +w.value, C = +document.getElementById('labC').value, B = +document.getElementById('labB').value, Q = document.getElementById('labQ').checked;
  const ge = [W > 50, C > 11250000, B > 6000000], geN = ge.filter(Boolean).length;
  const mi = [W > 10, C > 900000, B > 450000], miN = mi.filter(Boolean).length;
  document.getElementById('labWv').textContent = W; document.getElementById('labWv').className = 'lab-val' + (ge[0] ? ' over' : '');
  document.getElementById('labCv').textContent = fmtNum(C) + ' €'; document.getElementById('labCv').className = 'lab-val' + (ge[1] ? ' over' : '');
  document.getElementById('labBv').textContent = fmtNum(B) + ' €'; document.getElementById('labBv').className = 'lab-val' + (ge[2] ? ' over' : '');
  let cat, cls, txt;
  if (Q) { cat = 'Grande société'; cls = 'ge'; txt = 'Cotée en Bourse : grande société, quels que soient les chiffres.'; }
  else if (geN >= 2) { cat = 'Grande société'; cls = 'ge'; txt = geN + ' seuils sur 3 dépassés (il en faut au moins 2).'; }
  else if (miN <= 1) { cat = 'Microsociété'; cls = 'micro'; txt = geN + ' seuil de grande société dépassé, ' + miN + ' seuil micro dépassé (maximum 1 autorisé).'; }
  else { cat = 'Petite société'; cls = 'pe'; txt = geN + ' seuil de grande société dépassé (maximum 1 autorisé), mais ' + miN + ' seuils micro dépassés : pas micro.'; }
  document.getElementById('labTxt').textContent = txt;
  const b = document.getElementById('labBadge'); b.textContent = cat; b.className = 'lab-badge ' + cls;
}

// ============================================================
// QUESTIONS — rendu générique
// ============================================================
const TYPE_LABELS = {
  qcm:'Choix unique — 2 essais', vf:'Vrai ou faux — 1 essai', multi:'Plusieurs réponses possibles — 2 essais',
  input:'Réponse à écrire — 2 essais', classify:'Classement — 2 essais', match:'Association — 2 essais',
  order:'Remise en ordre — 2 essais', cloze:'Texte à trous — 2 essais', errors:'Chasse aux erreurs — 2 essais'
};

function renderQuestion(lv, q) {
  const L = LEVELS[lv], Q = getQ(lv, q), st = stateOf(lv, q);
  const dots = L.questions.map((_, i) => {
    const s = APP.qs[lv + '_' + i]; let c = '';
    if (s && s.done) c = s.status === 'correct' ? 'c' : s.status === 'hint' ? 'h' : 's';
    if (i === q) c = 'cur';
    return `<span class="${c}"></span>`;
  }).join('');
  let body = '';
  switch (Q.type) {
    case 'qcm': body = renderQCM(lv, q, Q, st); break;
    case 'vf': body = renderVF(lv, q, Q, st); break;
    case 'multi': body = renderMulti(lv, q, Q, st); break;
    case 'input': body = renderInput(lv, q, Q, st); break;
    case 'classify': body = renderClassify(lv, q, Q, st); break;
    case 'match': body = renderMatch(lv, q, Q, st); break;
    case 'order': body = renderOrder(lv, q, Q, st); break;
    case 'cloze': body = renderCloze(lv, q, Q, st); break;
    case 'errors': body = renderErrors(lv, q, Q, st); break;
  }
  const last = q === L.questions.length - 1;
  return `<div class="screen">
    <div class="q-top"><span><b>Mission ${lv + 1}</b> — ${L.icon} ${L.title}</span><span>Question ${q + 1}/${L.questions.length}</span></div>
    <div class="q-dots" style="margin-bottom:12px;">${dots}</div>
    <div class="q-card" id="qcard">
      <div class="q-type">${TYPE_LABELS[Q.type]} · ${Q.pts} XP</div>
      <div class="q-text">${Q.text}</div>
      ${body}
      <div class="feedback ${st.fb ? st.fb.cls + ' show' : ''}" id="fb">${st.fb ? st.fb.html : ''}</div>
      <div class="next-wrap ${st.done ? 'show' : ''}"><button class="btn btn-primary" onclick="nextQuestion()">${last ? 'Voir mon bilan ➜' : 'Question suivante ➜'}</button></div>
    </div>
  </div>`;
}

function afterRenderQuestion() {
  const inp = document.getElementById('inp');
  if (inp && !inp.disabled) { inp.focus(); calcPreview(inp); }
}

function fbText(head, explain) { return head + (explain ? `<span class="fb-x">${explain}</span>` : ''); }

function finalizeQ(lv, q, status, pts, head, explain, ev) {
  const Q = getQ(lv, q), st = stateOf(lv, q);
  st.done = true; st.status = status; st.pts = pts;
  APP.score += pts;
  if (!APP.results[lv]) APP.results[lv] = [];
  APP.results[lv].push({ q, status, pts, max:Q.pts });
  if (status === 'correct') {
    APP.streak++; if (APP.streak > APP.maxStreak) APP.maxStreak = APP.streak;
    if (APP.streak >= 3) comboFlash(APP.streak);
    if (APP.streak >= 5) awardBadge('streak5');
    if (APP.streak >= 10) awardBadge('streak10');
    if (Q.badge) awardBadge(Q.badge);
  } else { APP.streak = 0; }
  st.fb = { cls: status === 'correct' ? 'ok' : status === 'hint' ? 'hint' : 'ko', html: fbText(head, explain) };
  if (pts > 0) { const p = ev && ev.clientX ? { x:ev.clientX, y:ev.clientY } : cardPoint(); sparkleAt(p.x, p.y); floatPts(pts, p.x, p.y); playSound(status === 'correct' ? 'ok' : 'half'); }
  else { playSound('ko'); }
  updateHUD(); rankCheck(); renderScreen();
}

function wrongEffect() {
  const c = document.getElementById('qcard'); if (c) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  playSound('ko');
}
function cardPoint() { const c = document.getElementById('qcard'); if (!c) return { x:window.innerWidth / 2, y:window.innerHeight / 2 }; const r = c.getBoundingClientRect(); return { x:r.left + r.width / 2, y:Math.max(80, r.top + 60) }; }

function nextQuestion() {
  const L = LEVELS[APP.level];
  if (APP.q + 1 >= L.questions.length) { completeLevel(APP.level); return; }
  APP.q++; setScreen('question');
}

// ---------------- QCM ----------------
function renderQCM(lv, q, Q, st) {
  const letters = ['A', 'B', 'C', 'D', 'E'];
  return `<div class="options">${Q.options.map((o, i) => {
    let cls = 'opt';
    if (st.done) { cls += ' dis'; if (i === Q.correct) cls += ' ok'; else if (i === st.selected || i === st.wrong) cls += ' ko'; }
    else if (st.wrong === i) cls += ' dis ko';
    return `<button class="${cls}" onclick="answerQCM(${lv},${q},${i},event)"><span class="letter">${letters[i]}</span><span>${o}</span></button>`;
  }).join('')}</div>`;
}
function answerQCM(lv, q, i, ev) {
  const Q = getQ(lv, q), st = stateOf(lv, q); if (st.done) return;
  st.attempt++;
  if (i === Q.correct) {
    const pts = st.attempt === 1 ? Q.pts : Math.floor(Q.pts / 2); st.selected = i;
    finalizeQ(lv, q, st.attempt === 1 ? 'correct' : 'hint', pts, (st.attempt === 1 ? '✅ Parfait, du premier coup !' : '✅ Correct au second essai.') + ' +' + pts + ' XP', Q.explain, ev);
  } else if (st.attempt === 1) {
    st.wrong = i; st.fb = { cls:'hint', html:'💡 ' + Q.hint + '<span class="fb-x">Il te reste un essai.</span>' }; wrongEffect(); renderScreen();
  } else {
    st.selected = i; finalizeQ(lv, q, 'shown', 0, '👁 La bonne réponse était : <b>' + Q.options[Q.correct] + '</b>', Q.explain, ev);
  }
}

// ---------------- VRAI / FAUX ----------------
function renderVF(lv, q, Q, st) {
  return `<div class="vf">${[true, false].map(v => {
    let cls = 'vf-btn';
    if (st.done) { cls += ' dis'; if (v === Q.correct) cls += ' ok'; else if (v === st.selected) cls += ' ko'; }
    return `<button class="${cls}" onclick="answerVF(${lv},${q},${v},event)">${v ? '✔️ Vrai' : '✖️ Faux'}</button>`;
  }).join('')}</div>`;
}
function answerVF(lv, q, v, ev) {
  const Q = getQ(lv, q), st = stateOf(lv, q); if (st.done) return;
  st.attempt = 1; st.selected = v;
  if (v === Q.correct) finalizeQ(lv, q, 'correct', Q.pts, '✅ Exact ! +' + Q.pts + ' XP', Q.explain, ev);

// ---------------- SÉLECTION MULTIPLE ----------------

// ---------------- RÉPONSE À ÉCRIRE ----------------

// ---------------- CLASSEMENT PAR ZONES ----------------
function shuffled(n, seed) { const a = [...Array(n).keys()]; let s = seed; for (let i = n - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  Q.zones.forEach(z => {
    html += `<div class="zone z-${z.id} ${st.sel !== null ? 'target' : ''}" onclick="clPlace(${lv},${q},'${z.id}')"><div class="z-t">${z.icon} ${z.label}</div><div class="z-items">`;
    st.order.forEach(i => { if (st.placed[i] === z.id) { const lk = st.lock[i] || ''; html += `<div class="tag ${lk}" onclick="event.stopPropagation();clUnplace(${lv},${q},${i})">${Q.items[i].name}${lk === 'x' ? `<span class="fix">→ ${zoneOf(Q.items[i].zone).label}</span>` : ''}</div>`; } });
    html += `</div></div>`;

}
function clSelect(lv, q, i) { const st = stateOf(lv, q); if (st.done) return; st.sel = st.sel === i ? null : i; st.bounce = []; renderScreen(); }

// Bilan commun aux exercices à éléments (classement, association, ordre, trous)

  const head = status === 'correct' ? `✅ ${n}/${n} ${word} du premier coup ! +${pts} XP` : status === 'hint' ? `✅ Tout est correct après ton second essai. +${pts} XP` : `👁 ${c1 + c2}/${n} ${word}. Les erreurs restantes sont corrigées en rouge. +${pts} XP`;

// ---------------- ASSOCIATION ----------------
function renderMatch(lv, q, Q, st) {
  if (!st.sel) { st.sel = {}; st.lock = {}; }
  let html = `<div class="match">${Q.pairs.map((p, pi) => {
    const lk = st.lock[pi] || '';
    return `<div class="m-row"><div class="m-term">${p.term}</div><div style="flex:1.4;"><select class="m-sel ${lk}" style="width:100%;" ${lk ? 'disabled' : ''} onchange="APP.qs['${lv}_${q}'].sel[${pi}]=this.value===''?undefined:+this.value;renderScreen()"><option value="">— Choisis —</option>${Q.options.map((o, oi) => `<option value="${oi}" ${st.sel[pi] === oi ? 'selected' : ''}>${o}</option>`).join('')}</select>${lk === 'x' ? `<span class="fix">→ ${Q.options[p.correct]}</span>` : ''}</div></div>`;
  }).join('')}</div>`;
  const all = Q.pairs.every((_, pi) => st.sel[pi] !== undefined);
  if (!st.done) html += `<div class="btn-row"><button class="btn btn-verify ${all ? '' : 'btn-disabled'}" onclick="mtVerify(${lv},${q},event)">✅ Vérifier mes associations</button></div>`;
  return html;
}
function mtVerify(lv, q, ev) {

// ---------------- REMISE EN ORDRE ----------------
function renderOrder(lv, q, Q, st) {

  html += `</div><div class="slots">`;

function odAdd(lv, q, i) { const st = stateOf(lv, q); if (st.done || st.seq.includes(i)) return; const pos = st.seq.indexOf(null); if (pos < 0) return; st.seq[pos] = i; renderScreen(); }

// ---------------- TEXTE À TROUS ----------------
function renderCloze(lv, q, Q, st) {
  const n = Q.answers.length;
  if (!st.bank) { const words = Q.answers.concat(Q.distractors); st.bank = shuffled(words.length, lv * 13 + q * 3 + 7).map(i => words[i]); st.fill = {}; st.lock = {}; st.selB = null; }

  st.bank.forEach((w, bi) => { if (!used.includes(bi)) html += `<div class="tag" onclick="czWord(${lv},${q},${bi})">${w}</div>`; });

  });

  const all = [...Array(n).keys()].every(b => st.fill[b] !== undefined);
  if (!st.done) html += `<div class="btn-row"><button class="btn btn-verify ${all ? '' : 'btn-disabled'}" onclick="czVerify(${lv},${q},event)">✅ Vérifier le texte</button></div>`;
  return html;
}

// ---------------- CHASSE AUX ERREURS ----------------

    html += `<span class="seg ${lk} ${fl ? 'flag' : ''} ${st.faNow.includes(i) ? 'fa' : ''}" onclick="erToggle(${lv},${q},${i})">${s.t}</span> `;
    if (st.done && s.err) html += `<span class="corr">✏️ ${s.fix}</span>`;
  });
  html += `</div>`;
  const found = Object.values(st.lock).filter(x => x === 'c1' || x === 'c2').length;
  html += `<div class="hunt-count">Erreurs trouvées : ${found}/${nErr} · phrases signalées : ${st.flags.filter(i => !st.lock[i]).length}</div>`;
  if (!st.done) html += `<div class="btn-row"><button class="btn btn-verify ${st.flags.some(i => !st.lock[i]) ? '' : 'btn-disabled'}" onclick="erVerify(${lv},${q},event)">🔎 Vérifier mes signalements</button></div>`;

}
function erToggle(lv, q, i) { const st = stateOf(lv, q); if (st.done || st.lock[i]) return; st.faNow = []; const k = st.flags.indexOf(i); if (k >= 0) st.flags.splice(k, 1); else st.flags.push(i); renderScreen(); }

function completeLevel(i) {
  APP.completed.add(i);
  const pct = levelPct(i);
  if (!APP.completedExercises.includes(i)) {
    APP.completedExercises.push(i);
    const temps = Math.round((Date.now() - (APP.levelStart[i] || Date.now())) / 1000);
    sendResult((i + 1) + '. ' + LEVELS[i].title, levelXP(i), LEVELS[i].maxPoints, temps);
  }
  setScreen('bilan');
  if (i === 0) awardBadge('first');
  if (pct === 100) awardBadge('perfect');
  if (i === 5 && pct >= 85) awardBadge('lynx');
  if (i === 8) awardBadge('founder');
  const p = APP.predictions[i];
  if ((p === 'half' && pct < 65) || (p === 'most' && pct >= 65 && pct < 90) || (p === 'all' && pct >= 90)) awardBadge('oracle');
  if (APP.completed.size === LEVELS.length) {
    awardBadge('marathon');
    if (finalPct() >= 85) awardBadge('legend');
  }
  if (pct >= 85) setTimeout(() => launchConfetti(50), 300);
  playSound(pct >= 65 ? 'level' : 'ok');
}

function gradeFor(pct) {
  if (pct >= 85) return { g:'A — Excellent', c:'var(--success)', medal:'🏆', msg:'Impressionnant : tu maîtrises ce chapitre comme un pro.' };

function toggleSound() { APP.sound = !APP.sound; document.getElementById('soundBtn').textContent = APP.sound ? '🔊' : '🔇'; if (APP.sound) playSound('ok'); }
function tone(freq, start, dur, type, vol) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime + start; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .12, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.start(t); o.stop(t + dur + .05);
}
function playSound(kind) {
  if (!APP.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (kind === 'ok') { tone(660, 0, .12); tone(990, .1, .18); }
    else if (kind === 'half') { tone(520, 0, .15); tone(660, .12, .18); }
    else if (kind === 'ko') { tone(220, 0, .22, 'triangle', .1); }
    else if (kind === 'badge') { tone(784, 0, .12); tone(988, .1, .12); tone(1319, .2, .3); }
    else if (kind === 'level') { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .1, .28)); }
  } catch (e) { /* silence */ }
}

// Si oui, toutes les missions sont ouvertes pour qu'il reprenne où il veut.

function checkPreviousProgress(email, withMode) {
  email = (email || '').toLowerCase();
  if (!email) return;
  const cbName = '_progCb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  const cleanup = () => { delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove(); };
  const timeout = setTimeout(() => { cleanup(); console.warn('[TRACKING] Reprise : pas de réponse du serveur'); }, 10000);
  window[cbName] = function(resp) {
    clearTimeout(timeout); cleanup();
    const rows = (resp && (resp.leaderboard || resp.data)) || [];
    const me = rows.find(r => r && (r.email || '').toLowerCase() === email);
    const nb = me ? Number(me.niveauxCompletes || me.niveaux || 0) : 0;
    if (me && (nb >= 1 || Number(me.totalPoints || 0) > 0)) { unlockAllLevels(nb); return; }
    if (withMode) checkPreviousProgress(email, false); // 2e essai, sans le paramètre mode
    else console.log('[TRACKING] Reprise : aucun résultat précédent trouvé');
  };
  let url = `${TRACKING.scriptUrl}?action=leaderboard_app&callback=${cbName}&app=${encodeURIComponent(TRACKING.appName)}`;
  if (withMode) url += '&mode=last';
  if (APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const s = document.createElement('script'); s.id = cbName; s.src = url;
  s.onerror = () => { clearTimeout(timeout); cleanup(); console.warn('[TRACKING] Reprise : erreur de connexion'); };
  document.body.appendChild(s);
}

}

function renderLeaderboard(data, tab) {
  const content = document.getElementById('lbContent'), myEmail = (APP.email || '').toLowerCase();
  if (tab === 'global' && data.length > 0) {
    data = data.slice().sort((a, b) => { const pa = a.pct || 0, pb = b.pct || 0; if (pb !== pa) return pb - pa; return (a.totalTemps || 0) - (b.totalTemps || 0); });
    data.forEach((e, i) => { e.rang = i + 1; });
  }
  const me = data.find(r => r.email === myEmail);
  let html = `<h3 style="font-size:1rem;margin-bottom:12px;">${tab === 'app' ? '🏆 Classement — ' + TRACKING.appName : '🌍 Classement général'}${APP.classe ? ' (' + APP.classe + ')' : ''}</h3>`;
  if (me) {
    const pct = me.pct != null ? me.pct : 0;
    const count = tab === 'app' ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === 'app' ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const prog = total > 0 ? count + '/' + total + (tab === 'app' ? ' niveaux' : ' apps') : count + (tab === 'app' ? ' niveaux' : ' apps');
    html += `<div style="background:rgba(34,214,138,.08);border:1px solid rgba(34,214,138,.3);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent);">#${me.rang}</div><div style="font-size:.7rem;color:var(--text2);">rang</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;">${me.totalPoints}</div><div style="font-size:.7rem;color:var(--text2);">points</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct >= 80 ? 'var(--accent)' : pct >= 50 ? 'var(--orange)' : 'var(--error)'};">${pct}%</div><div style="font-size:.7rem;color:var(--text2);">réussite</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2);">${prog}</div><div style="font-size:.7rem;color:var(--text2);">progression</div></div>
    </div>`;
  }
  const medals = ['🥇', '🥈', '🥉'];
  html += '<table style="width:100%;border-collapse:collapse;font-size:.85rem;"><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:.72rem;">#</th><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:.72rem;">Élève</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem;">Pts</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem;">%</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:.72rem;">Temps</th></tr>';
  data.forEach(row => {
    const r = row.rang || 0, name = row.email.split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const pct = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0), temps = row.totalTemps || row.totalTime || 0, isMe = row.email === myEmail;
    const pctC = pct >= 80 ? 'var(--accent)' : pct >= 50 ? 'var(--orange)' : 'var(--error)';
    let tStr = '—'; if (temps > 0) { const m = Math.floor(temps / 60), s = temps % 60; tStr = m > 0 ? m + 'm' + String(s).padStart(2, '0') + 's' : s + 's'; }
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,.03);background:${isMe ? 'rgba(34,214,138,.08)' : 'transparent'};"><td style="padding:8px 4px;font-weight:700;">${r <= 3 ? medals[r - 1] : r}</td><td style="padding:8px 4px;${isMe ? 'font-weight:800;color:var(--accent);' : ''}">${name}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent);">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pctC};">${pct}%</td><td style="padding:8px 4px;text-align:right;color:var(--text2);font-family:'Space Mono',monospace;font-size:.78rem;">${tStr}</td></tr>`;
  });
  content.innerHTML = html + '</table>';
}

// ============================================================
// INIT
// ============================================================
function init() {
  updateHUD(); renderNav(); renderScreen();
  showEmailModal();
}
init();
</script>
</body>
</html>
